<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="image/logo.ico" type="image/x-icon">
    <link rel="stylesheet" href="CSS/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <title>Login</title>
</head>

<body>
    <header>
        <nav>
            <a href="index.html" class="logo">Zori</a>

            <div>
                <input type="text" placeholder="Search" class="search">
                <a href="shop.html"><i class="fa-solid fa-magnifying-glass"></i></a>
            </div>
            <i class="fa-solid fa-basket-shopping"></i>

            <ul class="bar">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Available</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
            <a href="login.html"><i class="fa-solid fa-circle-user"></i></a>
            <i class="fa fa-bars"></i>
        </nav>
    </header>

    <main>

        <div class="login" data-aos="fade-right">
            <div class="login_box">
                <h1 class="logo">Zori</h1>
                <p class="title">Welcome back</p>

                <div class="input_group">
                    <label for="email">Email</label>
                    <input type="email" placeholder="you@example.com" required>
                </div>

                <div class="input_group">
                    <label for="password">Password</label>
                    <input type="password" placeholder="At least 8 characters" required>
                </div>

                <a href="#" class="forgot">Forgot password?</a>

                <button type="submit" class="login_btn">Sign In</button>


                <p class="text">Don't have an account? <a href="#" class="signup">Sign up</a></p>
            </div>
        </div>
    </main>

    <footer>
        <p>
            Thank for your time.Enjoy your life.
        </p>
    </footer>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

        <script>
        AOS.init({
            duration: 1000,
        });
    </script>
</body>

</html>
